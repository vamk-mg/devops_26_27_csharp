
name: VowelCounterApp CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test C# application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Display .NET information
        run: dotnet --info

      - name: Restore application dependencies
        run: dotnet restore VowelCounterApp/VowelCounterApp.csproj

      - name: Build application
        run: dotnet build VowelCounterApp/VowelCounterApp.csproj --no-restore -c Release

      - name: Restore test dependencies
        run: dotnet restore VowelCounterApp.Tests/VowelCounterApp.Tests.csproj

      - name: Run unit tests
        run: >
          dotnet test VowelCounterApp.Tests/VowelCounterApp.Tests.csproj
          --no-restore
          -c Release
          --logger "trx;LogFileName=test-results.trx"

      - name: Publish C# application
        run: >
          dotnet publish VowelCounterApp/VowelCounterApp.csproj
          --no-restore
          -c Release
          -o ./publish

      - name: Upload C# application
        uses: actions/upload-artifact@v4
        with:
          name: VowelCounterApp
          path: publish/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VowelCounterApp-test-results
          path: VowelCounterApp.Tests/TestResults/
          if-no-files-found: ignore
          retention-days: 14

  deploy-website:
    name: Deploy website and report
    runs-on: ubuntu-latest
    needs: build-test

    # Only deploy from pushes to main, not pull requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check website files
        run: |
          test -f site/index.html
          test -f site/report.html

      - name: Upload website and report
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
